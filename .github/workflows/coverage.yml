name: Coverage

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    name: Bun test coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 1

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install PR dependencies
        working-directory: current
        run: bun install --frozen-lockfile

      - name: Run PR coverage
        working-directory: current
        run: bun test --coverage --coverage-reporter=lcov

      - name: Install base dependencies
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Run base coverage
        working-directory: base
        run: bun test --coverage --coverage-reporter=lcov

      - name: Compare coverage
        id: coverage
        run: node current/.github/scripts/coverage-report.mjs base/coverage/lcov.info current/coverage/lcov.info

      - name: Comment coverage report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- bun-coverage-report -->";
            const body = fs.readFileSync("coverage-comment.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on coverage regression
        if: steps.coverage.outputs.lowered == 'true'
        run: |
          echo "Coverage decreased compared with the base branch."
          exit 1
